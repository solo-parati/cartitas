<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frasco de cartitas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;height:100dvh;overflow:hidden;background:#12051f;font-family:"Fredoka",system-ui,sans-serif;color:#fff}
  #scene{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 70%,#4a1561 0%,#240a3d 55%,#12051f 100%);
         display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5dvh 16px 3dvh}
  #scene.tinte{filter:hue-rotate(var(--hue,0deg))}
  h1{font-family:"Caveat",cursive;font-size:clamp(2.2rem,9vw,3.6rem);text-align:center;color:#fbcfe8;text-shadow:0 0 14px #ec4899aa;line-height:1;z-index:2}
  h1 small{display:block;font-family:"Fredoka",sans-serif;font-size:.4em;color:#f5d0fe;margin-top:8px;text-shadow:none}
  #frasco{height:min(58dvh,460px);aspect-ratio:300/400;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
          filter:drop-shadow(0 0 24px #f472b688);z-index:2;overflow:visible}
  #frasco.sacude{animation:sacude .5s}
  @keyframes sacude{20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}
  #pista{z-index:2;color:#f5d0fe;font-size:1.1rem;text-shadow:0 0 10px #ec4899;animation:pulso 2s ease-in-out infinite}
  @keyframes pulso{50%{opacity:.5}}
  .fl{position:absolute;bottom:-40px;color:#f9a8d4;opacity:0;pointer-events:none;animation:sube linear infinite;z-index:1}
  @keyframes sube{10%{opacity:.55}100%{transform:translateY(-110dvh) rotate(25deg);opacity:0}}

  /* fondo: bokeh + estrellas + luciérnagas */
  #fondo{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .bokeh{position:absolute;border-radius:50%;filter:blur(38px);opacity:.38;animation:flota ease-in-out infinite alternate}
  @keyframes flota{to{transform:translate(var(--dx),var(--dy)) scale(1.18)}}
  .est{position:absolute;border-radius:50%;background:#fff;animation:titila ease-in-out infinite}
  @keyframes titila{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.95;transform:scale(1.15)}}
  .fugaz{position:absolute;width:110px;height:2px;border-radius:2px;background:linear-gradient(90deg,#fff,#fff0);opacity:0;transform:rotate(28deg);animation:fugaz 9s ease-in infinite}
  @keyframes fugaz{0%{opacity:0;transform:translate(0,0) rotate(28deg)}3%{opacity:1}12%{opacity:0;transform:translate(260px,140px) rotate(28deg)}100%{opacity:0}}
  .lu{position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle,#fff7b0 0%,#fde047 40%,#fde04700 72%);
      box-shadow:0 0 12px 4px #fde04788;animation:luz 4s ease-in-out infinite,vaga linear infinite alternate}
  @keyframes luz{0%,100%{opacity:.2}50%{opacity:1}}
  @keyframes vaga{25%{transform:translate(var(--x1),var(--y1))}50%{transform:translate(var(--x2),var(--y2))}75%{transform:translate(var(--x3),var(--y3))}100%{transform:translate(var(--x4),var(--y4))}}
  @media (prefers-reduced-motion:reduce){.bokeh,.est,.fugaz,.lu{animation:none}.est{opacity:.6}.lu{opacity:.8}.fugaz{display:none}}

  /* carta */
  #velo{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#0b0314d9;opacity:0;pointer-events:none;transition:opacity .25s}
  #velo.show{opacity:1;pointer-events:auto}
  #carta{width:min(86vw,380px);max-height:88dvh;overflow:auto;background:#fff8ee;color:#4a2c3a;border-radius:18px;padding:24px 24px 18px;text-align:center;
         box-shadow:0 0 0 3px #f9a8d4,0 0 40px 8px #ec489988;transform:translateY(180px) scale(.2) rotate(-8deg);transition:transform .55s cubic-bezier(.2,1.3,.4,1)}
  #velo.show #carta{transform:none}
  #carta .sobre{font-size:2rem}
  #carta h2{font-family:"Caveat",cursive;font-size:2.1rem;color:#be185d;margin:6px 0 12px;line-height:1.05}
  #carta p{font-size:1.1rem;line-height:1.45;white-space:pre-line}
  #carta small{display:block;margin-top:16px;color:#a78bad;font-size:.85rem}
</style>
</head>
<body>
<div id="scene">
  <div id="fondo"></div>
  <h1 id="titulo"></h1>
  <svg id="frasco" viewBox="0 0 300 400" aria-label="Frasco de cartitas">
    <defs>
      <linearGradient id="tapa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbcfe8"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
      <linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".16"/></linearGradient>
    </defs>
    <g id="papeles"></g>
    <path d="M95 78 L95 105 Q40 118 40 175 L40 340 Q40 385 85 385 L215 385 Q260 385 260 340 L260 175 Q260 118 205 105 L205 78 Z" fill="url(#vidrio)" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
    <path d="M62 170 Q57 250 66 330" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="8" stroke-linecap="round"/>
    <rect x="85" y="42" width="130" height="40" rx="10" fill="url(#tapa)"/>
    <path d="M105 50 V74 M125 50 V74 M145 50 V74 M165 50 V74 M185 50 V74 M205 50 V74" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
    <rect x="75" y="318" width="150" height="40" rx="10" fill="#fff8ee"/>
    <text x="150" y="346" text-anchor="middle" font-family="Caveat,cursive" font-size="28" font-weight="700" fill="#be185d">Abre cuando…</text>
  </svg>
  <div id="pista">Toca el frasco 💌</div>
  <div id="velo">
    <div id="carta">
      <div class="sobre">💌</div>
      <h2 id="ct"></h2>
      <p id="cm"></p>
      <small id="cn"></small>
    </div>
  </div>
</div>

<script>
const DEFECTO = [
  ["Abre cuando estés triste", "Recuerda que todo pasa y que siempre voy a estar contigo. Respira hondo, tú puedes con esto. 💜"],
  ["Abre cuando necesites reírte", "Eres la única persona capaz de hacerme reír hasta cuando no quiero. Sonríe, que te queda perfecto. 😄"],
  ["Abre cuando no puedas dormir", "Cierra los ojos, respira lento y piensa en algo bonito. Mañana será un mejor día. 🌙"],
  ["Abre cuando dudes de ti", "Vales mucho más de lo que crees. Yo siempre creo en ti. ✨"],
  ["Abre cuando me extrañes", "Aunque no estemos juntos, estoy pensando en ti. Pronto nos vemos. 💌"],
];
const COLORES = { rosa:0, morado:-50, azul:-100, verde:-180 };

// Personalización por link: ?p=Nombre&t=Título&c=azul&m=Título1~Mensaje1|Título2~Mensaje2
const q = new URLSearchParams(location.search);
const TITULO = (q.get("t") || "Mi frasco de cartitas").slice(0, 60);
const PARA = (q.get("p") || "").slice(0, 40);
let CARTAS = (q.get("m") || "").split("|").map(x => x.split("~"))
  .filter(a => a[0] && a[0].trim()).slice(0, 12)
  .map(([t, ...m]) => [t.trim().slice(0, 60), m.join("~").trim().slice(0, 300)]);
if (!CARTAS.length) CARTAS = DEFECTO;

const $ = id => document.getElementById(id), scene = $("scene");
const col = q.get("c"), hue = Object.hasOwn(COLORES, col) ? COLORES[col] : 0;
document.documentElement.style.setProperty("--hue", hue + "deg");
if (hue) scene.classList.add("tinte");

document.title = TITULO;
$("titulo").append(TITULO);
if (PARA) { const s = document.createElement("small"); s.textContent = "Para " + PARA; $("titulo").append(s); }

// papelitos doblados dentro del frasco
const NS = "http://www.w3.org/2000/svg", pap = $("papeles");
const COL = ["#fbcfe8", "#e9d5ff", "#fde68a", "#bfdbfe", "#fecdd3", "#d9f99d"];
let sem = 7; const rnd = () => (sem = (sem * 9301 + 49297) % 233280) / 233280;
for (let i = 0; i < 18; i++) {
  const x = 78 + rnd()*144, y = 150 + rnd()*210, a = rnd()*90 - 45;
  const g = document.createElementNS(NS, "g"); g.setAttribute("transform", `translate(${x} ${y}) rotate(${a})`);
  const r = document.createElementNS(NS, "rect");
  [["x",-19],["y",-12],["width",38],["height",24],["rx",3],["fill",COL[i%6]],["stroke","#fff"],["stroke-opacity",.6]].forEach(([k,v]) => r.setAttribute(k, v));
  const h = document.createElementNS(NS, "text");
  [["text-anchor","middle"],["y",4],["font-size",12],["fill","#ec4899"]].forEach(([k,v]) => h.setAttribute(k, v)); h.textContent = "♥";
  g.append(r, h); pap.append(g);
}

// fondo: bokeh grande detrás del frasco, estrellas que titilan, estrella fugaz y luciérnagas
const fondo = $("fondo"), R = (a, b) => a + Math.random() * (b - a);
const mk = (cls, css) => { const e = document.createElement("div"); e.className = cls; e.style.cssText = css; fondo.append(e); };
[["#ec4899", 34, 50, 62], ["#a855f7", 40, 28, 40], ["#f472b6", 26, 72, 34], ["#8b5cf6", 30, 22, 74], ["#fb7185", 22, 82, 66]]
  .forEach(([c, w, l, t]) => mk("bokeh", `background:${c};width:${w}vmin;height:${w}vmin;left:calc(${l}% - ${w/2}vmin);top:calc(${t}% - ${w/2}vmin);--dx:${R(-40,40)}px;--dy:${R(-30,30)}px;animation-duration:${R(9,16)}s`));
for (let i = 0; i < 110; i++) { const z = R(1, 2.8);
  mk("est", `left:${R(0,100)}%;top:${R(0,100)}%;width:${z}px;height:${z}px;animation-duration:${R(2,6)}s;animation-delay:${-R(0,6)}s`); }
mk("fugaz", `left:${R(5,45)}%;top:${R(4,25)}%`);
for (let i = 0; i < 22; i++)
  mk("lu", `left:${R(3,95)}%;top:${R(15,92)}%;animation-duration:${R(3,6)}s,${R(14,26)}s;animation-delay:${-R(0,6)}s,${-R(0,20)}s;`
    + [1,2,3,4].map(k => `--x${k}:${R(-70,70)}px;--y${k}:${R(-70,70)}px`).join(";"));

// corazoncitos que suben
for (let i = 0; i < 14; i++) {
  const f = document.createElement("span"); f.className = "fl"; f.textContent = "♥";
  f.style.cssText = `left:${Math.random()*100}%;font-size:${10+Math.random()*16}px;animation-duration:${8+Math.random()*8}s;animation-delay:${-Math.random()*12}s`;
  scene.append(f);
}

// cada toque al frasco saca la siguiente carta; tocar la carta la cierra
let n = -1;
const frasco = $("frasco"), velo = $("velo");
frasco.addEventListener("pointerdown", () => {
  if (velo.classList.contains("show")) return;
  n = (n + 1) % CARTAS.length;
  $("ct").textContent = CARTAS[n][0];
  $("cm").textContent = CARTAS[n][1];
  $("cn").textContent = `Carta ${n+1} de ${CARTAS.length} · toca para cerrar`;
  velo.classList.add("show");
  frasco.classList.remove("sacude"); void frasco.getBoundingClientRect(); frasco.classList.add("sacude");
  $("pista").textContent = "Toca otra vez para otra cartita 💌";
});
velo.addEventListener("pointerdown", () => velo.classList.remove("show"));
</script>
</body>
</html>
